<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 420" role="img" aria-labelledby="title description">
  <title id="title">PanelWise logo</title>
  <desc id="description">An owl formed from three letter P shapes beside the PanelWise wordmark.</desc>

  <defs>
    <style>
      .wordmark { fill: #031b42; }
      @media (prefers-color-scheme: dark) {
        .wordmark { fill: #f5f7ff; }
      }
    </style>
    <linearGradient id="indigo" x1="42" y1="35" x2="200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2440ff"/>
      <stop offset="1" stop-color="#0927df"/>
    </linearGradient>
    <linearGradient id="cyan" x1="378" y1="35" x2="220" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12cdef"/>
      <stop offset="1" stop-color="#03aee7"/>
    </linearGradient>
    <linearGradient id="lime" x1="210" y1="214" x2="210" y2="414" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a8dd35"/>
      <stop offset="1" stop-color="#77c72d"/>
    </linearGradient>
  </defs>

  <g id="owl-mark">
    <path
